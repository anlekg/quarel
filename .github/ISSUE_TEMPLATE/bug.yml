name: Bug
description: Quelque chose ne marche pas comme prévu
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Où ?
      options:
        - Application de bureau (Windows)
        - Application de bureau (Linux)
        - Application web
        - Serveur communautaire
        - Service d'identité
        - Site / wiki
        - Autre
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Application : Paramètres › À propos. Serveur : page d'administration ou `quarel-server version`.
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui était attendu, ce qui s'est passé
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Journal ou captures
      description: Retirez adresses IP, emails, jetons et mots de passe avant de coller.
      render: text
