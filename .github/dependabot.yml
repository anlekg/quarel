# Dependency updates, grouped to keep the pull requests few. Major versions come
# one by one (they may need code changes); security fixes are always opened.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    groups:
      client:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
