# Quarel Identity service — self-hosted deployment with Docker Compose.
#
#   cp .env.example .env    # then edit it: domain, email, SMTP
#   docker compose up -d --build
#
# HTTPS comes from Let's Encrypt (TLS-ALPN-01): the domain must point to this
# machine and port 443 must reach it. Behind an existing reverse proxy, use
# compose.proxy.yaml instead. Operator tools:
#   docker compose exec identity /quarel-identity admin help
services:
  identity:
    build:
      context: ../..
      dockerfile: Dockerfile.identity
    image: quarel-identity
    restart: unless-stopped
    env_file: .env
    environment:
      # The administration page is only published on 127.0.0.1 (below): it
      # reaches the container through Docker's local network, never the
      # Internet, so plain HTTP is fine (elsewhere it requires HTTPS).
      QUAREL_ADMIN_TLS: "off"
      QUAREL_ADDR: ":8443"
      QUAREL_TLS: acme
    ports:
      - "443:8443"
      # Administration page: this machine only (on a rented server, use an
      # SSH tunnel: ssh -L 8081:127.0.0.1:8081 <server>, then http://localhost:8081).
      - "127.0.0.1:8081:8081"
      # Call relay (TURN), when QUAREL_TURN=on: signalling port and relay range.
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - identity-data:/data

volumes:
  # Holds the database and the signing key: back it up (see site/src/content/docs/wiki/heberger/service-identite.md).
  identity-data:
